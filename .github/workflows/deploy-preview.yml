name: preview-version-upload

# FUTURE authorized preview workflow (task #26): this job is committed and
# tested but MUST NOT be triggered without explicit human authorization. A real
# run would execute `wrangler versions upload --env preview` (creates a
# non-active preview version, not a deploy) using an explicit confirmation
# string, the GitHub `preview` environment, and fail-closed secret handling.
# The offline CI audit (scripts/deploy-dryrun.mjs) is the no-secret path.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (preview only)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
      confirm:
        description: 'Confirmation string (must be "upload-preview-version")'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview-version-upload:
    runs-on: ubuntu-latest
    environment: preview
    if: ${{ github.event.inputs.confirm == 'upload-preview-version' && github.event.inputs.environment == 'preview' }}
    steps:
      - name: Refuse without explicit authorization
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "upload-preview-version" ]]; then
            echo "Confirmation mismatch; refusing to upload a preview version." >&2
            exit 1
          fi
          echo "Explicitly authorized preview version upload (never triggered by this task)."

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack + install (frozen lockfile)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Offline dry-run audit (no secret, no upload)
        run: pnpm exec node --experimental-strip-types scripts/deploy-dryrun.mjs

      - name: Fail closed when required secrets are missing
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing; refusing to upload." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The actual upload step is intentionally absent: this job must never be
      # triggered without explicit human authorization. When authorized, the
      # deployer would run: pnpm exec wrangler versions upload --env preview
