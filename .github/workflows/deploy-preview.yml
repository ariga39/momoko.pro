name: preview-version-upload

# Future authorized preview workflow (task #26): committed and tested, but
# NEVER triggered by this task. When a human explicitly authorizes it, running
# this workflow executes `wrangler versions upload --env preview` (creates a
# non-active preview version, not a deploy). Guards: exact confirmation string,
# GitHub `preview` environment, and fail-closed token/account. This task never
# runs the workflow, so there is zero Cloudflare write.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (preview only)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
      confirm:
        description: 'Confirmation string (must be "upload-preview-version")'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview-version-upload:
    runs-on: ubuntu-latest
    environment: preview
    # No job-level skip: any dispatch must reach the confirmation gate so a
    # mismatch fails closed, never a green no-op.
    steps:
      - name: Refuse without exact confirmation
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "upload-preview-version" || "${{ github.event.inputs.environment }}" != "preview" ]]; then
            echo "Confirmation/environment mismatch; refusing to upload a preview version." >&2
            exit 1
          fi
          echo "Explicitly authorized preview version upload."

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack + install (frozen lockfile)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Fail closed when required secrets are missing
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing; refusing to upload." >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload non-active preview version (authorized path, not dry-run)
        run: pnpm exec wrangler versions upload --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
