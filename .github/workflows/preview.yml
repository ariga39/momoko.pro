name: preview

# 远程 preview（可选，§8.3）：仅由 maintainer 对固定 SHA 手动触发。
# 两-job DAG：
#   build —— 零 secret，只产/审计/上传 public-only artifact（仅 reviewed/current；
#             draft/stale/retracted 正文不随公开仓库 artifact 分发）。
#   deploy —— 仅 if: inputs.deploy，needs: build，environment: preview；
#             只 download public artifact，不 checkout/不运行 target SHA 代码。
# 禁止 production deploy、隐式建项目、默认 project 名、付费/新条款。

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Fixed 40-hex commit SHA to build & preview"
        required: true
        type: string
      deploy:
        description: "Deploy public artifact to Cloudflare preview (requires approval + secrets)"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Validate target_sha (40-hex)
        run: |
          if ! [[ "${{ inputs.target_sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full 40-hex commit SHA"
            exit 1
          fi

      - name: Checkout fixed ref (public build only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Preflight — record dispatch main relation (target vs origin/main)
        run: |
          set -euo pipefail
          git cat-file -t "${{ inputs.target_sha }}"
          dispatch_main=$(git rev-parse origin/main)
          echo "dispatch_main_sha=$dispatch_main" >> "$GITHUB_ENV"
          if [ "${{ inputs.target_sha }}" = "$dispatch_main" ]; then
            echo "target_equals_dispatch_main=yes" >> "$GITHUB_ENV"
            echo "target_is_ancestor_of_dispatch_main=yes" >> "$GITHUB_ENV"
          elif git merge-base --is-ancestor "${{ inputs.target_sha }}" "$dispatch_main" 2>/dev/null; then
            echo "target_equals_dispatch_main=no" >> "$GITHUB_ENV"
            echo "target_is_ancestor_of_dispatch_main=yes" >> "$GITHUB_ENV"
          else
            echo "target_equals_dispatch_main=no" >> "$GITHUB_ENV"
            echo "target_is_ancestor_of_dispatch_main=no" >> "$GITHUB_ENV"
          fi

      - name: Setup Node 24 (reproducible, no Node20 annotation)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Enable corepack + install (frozen lockfile)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Build public-only static site (clean output, reviewed/current only)
        run: |
          rm -rf dist-public
          pnpm build:public

      - name: Audit public artifact — no draft/stale/retracted, no raw/secret-shaped
        run: |
          set -euo pipefail
          node --experimental-strip-types tools/schema/public-audit.mjs dist-public

      - name: Upload public artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: momoko-preview-public-${{ inputs.target_sha }}
          path: dist-public/
          retention-days: 7

      - name: Compute artifact content hash
        run: |
          set -euo pipefail
          find dist-public -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/dist.sha256sums
          sha256sum /tmp/dist.sha256sums | awk '{print $1}' | tee /tmp/dist-hash
          echo "preview_artifact_hash=$(cat /tmp/dist-hash)" >> "$GITHUB_ENV"

      - name: Publish preview summary
        run: |
          if [ "${{ inputs.deploy }}" = "true" ]; then
            deploy_status=requested
          else
            deploy_status=artifact_only_public
          fi
          cat > "$GITHUB_STEP_SUMMARY" <<EOF
          ## momoko.pro preview
          - target_sha: \`${{ inputs.target_sha }}\`
          - target_equals_dispatch_main: \`${{ env.target_equals_dispatch_main }}\`
          - target_is_ancestor_of_dispatch_main: \`${{ env.target_is_ancestor_of_dispatch_main }}\`
          - artifact hash: \`${{ env.preview_artifact_hash }}\`
          - deploy_status: \`$deploy_status\`
          EOF
          echo "deploy_status=$deploy_status" >> "$GITHUB_ENV"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: preview
    if: ${{ inputs.deploy }}
    env:
      CI: "true"
    steps:
      - name: Validate required environment variables (no defaults)
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?required for deploy}"
          : "${CLOUDFLARE_ACCOUNT_ID:?required for deploy}"
          : "${CLOUDFLARE_PROJECT_NAME:?required for deploy}"
      - name: Download public artifact (do NOT checkout or run target code)
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: momoko-preview-public-${{ inputs.target_sha }}
          path: dist-public
      - name: Read-only project preflight (must exist; never create)
        run: |
          set -euo pipefail
          wrangler pages project list >/dev/null 2>&1 || true
          if ! wrangler pages project list 2>/dev/null | grep -q "$CLOUDFLARE_PROJECT_NAME"; then
            echo "::error::Cloudflare project '$CLOUDFLARE_PROJECT_NAME' does not exist; refusing to create or deploy."
            exit 1
          fi
      - name: Deploy preview (full-SHA Cloudflare action)
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-public --project-name=$CLOUDFLARE_PROJECT_NAME
      - name: Final summary (requested → succeeded/failed with URL)
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            status=succeeded
            url="${{ steps.deploy.outputs.deployment-url }}"
          else
            status=failed
            url=""
          fi
          echo "deploy_status=$status" >> "$GITHUB_ENV"
          cat > "$GITHUB_STEP_SUMMARY" <<EOF
          ## momoko.pro preview deploy
          - target_sha: \`${{ inputs.target_sha }}\`
          - deploy_status: \`$status\`
          - preview url: \`$url\`
          EOF
