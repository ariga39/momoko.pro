name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # PR 触发路径不注入任何 secret（§8.3）：无 CF token、无模型 key、不部署。
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Schema + unit tests
        run: pnpm test

      - name: Deterministic build (double-build byte compare)
        run: pnpm build:verify

      - name: Post-build artifacts
        run: pnpm build:post

      - name: Browser smoke (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Upload browser artifacts (no secrets)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
