name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # PR 触发路径不注入任何 secret（§8.3）：无 CF token、无模型 key、不部署。
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Enable corepack + install (frozen lockfile)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm check

      - name: Schema + unit tests
        run: pnpm test

      - name: Deterministic build (double-build byte compare)
        run: pnpm build:verify

      - name: Post-build artifacts
        run: pnpm build:post

      - name: Browser smoke (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
        continue-on-error: false

      # 仅当真实失败且确实产生 test-results/ 证据时才上传；无证据则静默。
      - name: Upload browser artifacts (no secrets, conditional on evidence)
        if: failure() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
