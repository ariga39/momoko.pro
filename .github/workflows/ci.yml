name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # PR 触发路径不注入任何 secret（§8.3）：无 CF token、无模型 key、不部署。
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm check

      - name: Schema + unit tests
        run: pnpm test

      - name: Deterministic build (double-build byte compare)
        run: pnpm build:verify

      - name: Post-build artifacts
        run: pnpm build:post

      - name: Browser smoke (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      # 仅当存在真实失败证据（test-results/）才上传；无失败时静默，避免空目录 warning。
      - name: Upload browser artifacts (no secrets, conditional)
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
