  <title id="title-greyblue">Momoko production — grey-blue cream soda logo</title>
  <desc id="desc-greyblue">A compact editorial masthead with a muted grey-blue cream soda, rose cherry, serif Momoko wordmark, divider, and tracked production label.</desc>
